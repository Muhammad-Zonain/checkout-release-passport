name: Checkout script control monitoring

on:
  schedule:
    # Avoid the top of the hour, when scheduled GitHub Actions can be delayed.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: checkout-control-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  checkout-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Observe checkout, compare controls, retain evidence, and alert
        # For production, replace v0.4.1 with the reviewed release's full commit SHA.
        uses: Muhammad-Zonain/checkout-release-passport@v0.4.1
        with:
          operation: check
          config_path: .checkout-evidence/production.json
          ack_authorized: "true"
          install_browser: "true"
          fail_on_review: "true"
          alert_mode: github-issue
          github_token: ${{ github.token }}
          retention_days: "90"
