name: Initialize checkout release baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create baseline onboarding artifact
        # For production, replace v0.4.1 with the reviewed release's full commit SHA.
        uses: Muhammad-Zonain/checkout-release-passport@v0.4.1
        with:
          operation: baseline
          config_path: .checkout-evidence/staging.json
          ack_authorized: "true"
          install_browser: "true"

      - name: Mandatory human review reminder
        run: |
          echo "Download the baseline artifact, review every observed script and header, complete the approval template, and commit only the reviewed files."
