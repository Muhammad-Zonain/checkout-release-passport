name: Checkout release gate

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  checkout-release-passport:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create pre-release checkout evidence
        # For production, replace v0.4.1 with the reviewed release's full commit SHA.
        uses: Muhammad-Zonain/checkout-release-passport@v0.4.1
        with:
          operation: check
          config_path: .checkout-evidence/staging.json
          ack_authorized: "true"
          install_browser: "true"
          fail_on_review: "true"
